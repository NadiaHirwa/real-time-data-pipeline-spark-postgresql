name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_events
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ecommerce_events -f sql/postgres_setup_ci.sql

      - name: Run test suite
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecommerce_events
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: python -m pytest tests/ -v